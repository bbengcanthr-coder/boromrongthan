<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>โรงทานช่างศิลปบรม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ee;--ink:#1f2b24;--mute:#7c887f;--line:#dfe5d8;--acc:#f0a62b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom))}
h1{font-size:19px;font-weight:600;text-align:center;margin:2px 0 10px;letter-spacing:.2px}
#stage{position:relative;width:100%;aspect-ratio:10/6.4;flex:none;touch-action:none;border-radius:22px;background:#fff;border:1px solid var(--line);overflow:hidden}
#plate{position:absolute;left:2%;top:50%;width:96%;transform:translateY(-50%);pointer-events:none}
.item{position:absolute;touch-action:none;cursor:grab}
.item img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.item.pop img{animation:pop .28s ease-out}
.item.sel::after{content:"";position:absolute;inset:-5px;border:1.5px dashed var(--acc);border-radius:14px;pointer-events:none}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.item.pop img{animation:none}}
#bar{height:46px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--mute)}
.ic{width:42px;height:34px;border-radius:12px;border:1px solid var(--line);background:#fff;font:400 18px inherit;color:var(--ink)}
.ic:active{background:var(--acc)}
#tray{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:7px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:5px 3px 4px;border-radius:14px;background:#fff;border:1px solid var(--line);touch-action:none;cursor:grab}
.cell img{flex:1;min-height:0;max-width:86%;object-fit:contain;pointer-events:none}
.cell span{font-size:11px;color:var(--mute);margin-top:3px;white-space:nowrap}
.cell.rnd{border:1.5px dashed var(--acc);background:transparent;cursor:pointer;touch-action:manipulation}
.cell.rnd b{font-size:15px;font-weight:600}
.cell.rnd span{margin-top:1px}
.ghost{position:fixed;transform:translate(-50%,-50%) scale(1.06);pointer-events:none;z-index:50;filter:drop-shadow(0 8px 10px rgba(31,43,36,.28))}
#foot{display:flex;gap:9px;margin-top:10px;flex:none}
.btn{flex:1;height:48px;border-radius:24px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:600 15px "Noto Sans Thai",system-ui,sans-serif}
.btn.p{background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
#modal{position:fixed;inset:0;background:rgba(31,43,36,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
#modal.on{display:flex}
.card{background:#fff;border-radius:24px;padding:14px;width:100%;max-width:420px;text-align:center}
.card img{width:100%;display:block;border-radius:14px;border:1px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.card p{font-size:12px;color:var(--mute);margin:10px 0}
.card .row{display:flex;gap:9px}
</style>
</head>
<body>
<div id="app">
  <h1>โรงทานช่างศิลปบรม</h1>
  <div id="stage"><img id="plate" alt=""></div>
  <div id="bar"></div>
  <div id="tray"></div>
  <div id="foot">
    <button class="btn" id="clear">ล้างจาน</button>
    <button class="btn p" id="save">บันทึกภาพ</button>
  </div>
</div>
<div id="modal"><div class="card">
  <img id="out" alt="จานของคุณ">
  <p>กดค้างที่รูปเพื่อบันทึก หรือกดปุ่มด้านล่าง</p>
  <div class="row"><button class="btn" id="close">ปิด</button><button class="btn p" id="dl">บันทึกลงเครื่อง</button></div>
</div></div>

const LIST=[["rice","ข้าวสวย",.26],["friedrice","ข้าวผัด",.26],["noodle","ขนมจีน",.3],["tomyum","ต้มยำกุ้ง",.36],["green","แกงเขียวหวาน",.38],["kale","คะน้าหมูกรอบ",.34],["basil","กะเพราหมู",.28],["omelet","ไข่เจียว",.34],["chicken","ไก่ทอด",.3],["egg","ไข่ดาว",.2],["melon","แตงโม",.18]];
const $=s=>document.querySelector(s),stage=$('#stage'),R=()=>stage.getBoundingClientRect(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let items=[],sel=null,z=1,blob=null;
$('#plate').src=IMG.plate;
document.addEventListener('gesturestart',e=>e.preventDefault());

function put(it){const e=it.el.style;e.left=it.x*100+'%';e.top=it.y*100+'%';e.width=it.w*100+'%';e.zIndex=it.z;e.transform='translate(-50%,-50%) rotate('+it.r+'deg)'}
function pick(it){sel=it;items.forEach(i=>i.el.classList.toggle('sel',i===it));if(it){it.z=++z;put(it)}bar()}
function bar(){$('#bar').innerHTML=sel?'<button class="ic" data-a="s-">−</button><button class="ic" data-a="s+">+</button><button class="ic" data-a="rot">↻</button><button class="ic" data-a="del">✕</button>':'ลากอาหารมาวางบนจาน หรือแตะเพื่อเพิ่ม'}
$('#bar').onclick=e=>{const a=e.target.dataset.a;if(!a||!sel)return;
  if(a==='s-')sel.w=Math.max(.08,sel.w*.88);
  if(a==='s+')sel.w=Math.min(.9,sel.w*1.14);
  if(a==='rot')sel.r+=20;
  if(a==='del'){sel.el.remove();items=items.filter(i=>i!==sel);pick(null);return}
  put(sel)};
stage.onpointerdown=()=>pick(null);

function add(k,x,y){
  const d=LIST.find(a=>a[0]===k),e=document.createElement('div');
  e.className='item pop';e.innerHTML='<img src="'+IMG[k]+'" alt="">';
  const it={k,x:clamp(x,.05,.95),y:clamp(y,.08,.92),w:d[2],r:0,z:++z,el:e};
  e.onpointerdown=ev=>{ev.stopPropagation();pick(it);
    const r=R(),sx=ev.clientX,sy=ev.clientY,ox=it.x,oy=it.y;e.setPointerCapture(ev.pointerId);
    e.onpointermove=m=>{it.x=clamp(ox+(m.clientX-sx)/r.width,0,1);it.y=clamp(oy+(m.clientY-sy)/r.height,0,1);put(it)};
    e.onpointerup=e.onpointercancel=()=>{e.onpointermove=e.onpointerup=e.onpointercancel=null}};
  stage.appendChild(e);items.push(it);put(it);pick(it);return it}

const tray=$('#tray');
LIST.forEach(([k,n,w])=>{
  const c=document.createElement('div');c.className='cell';
  c.innerHTML='<img src="'+IMG[k]+'" alt=""><span>'+n+'</span>';tray.appendChild(c);
  c.onpointerdown=ev=>{c.setPointerCapture(ev.pointerId);
    const sx=ev.clientX,sy=ev.clientY;let g=null;
    const end=()=>{c.onpointermove=c.onpointerup=c.onpointercancel=null};
    c.onpointermove=m=>{
      if(!g&&Math.hypot(m.clientX-sx,m.clientY-sy)>8){g=document.createElement('img');g.src=IMG[k];g.className='ghost';g.style.width=w*R().width+'px';document.body.appendChild(g)}
      if(g){g.style.left=m.clientX+'px';g.style.top=m.clientY+'px'}};
    c.onpointerup=m=>{end();const r=R();
      if(g){g.remove();if(m.clientX>r.left&&m.clientX<r.right&&m.clientY>r.top&&m.clientY<r.bottom)add(k,(m.clientX-r.left)/r.width,(m.clientY-r.top)/r.height)}
      else add(k,.5+(Math.random()-.5)*.3,.5+(Math.random()-.5)*.2)};
    c.onpointercancel=()=>{if(g)g.remove();end()}}});

const rc=document.createElement('div');rc.className='cell rnd';rc.innerHTML='<b>สุ่ม</b><span>จัดให้เลย</span>';tray.appendChild(rc);
function clear(){items.forEach(i=>i.el.remove());items=[];pick(null)}
rc.onclick=()=>{clear();
  add(['rice','friedrice'][Math.random()*2|0],.36+Math.random()*.06,.56);
  const S=[[.67,.4],[.6,.7],[.3,.32],[.72,.64]];
  LIST.map(a=>a[0]).filter(k=>k!=='rice'&&k!=='friedrice').sort(()=>Math.random()-.5).slice(0,3+(Math.random()*2|0))
    .forEach((k,i)=>add(k,S[i][0]+Math.random()*.04,S[i][1]+Math.random()*.04));
  pick(null)};
$('#clear').onclick=clear;

const ld=k=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=IMG[k]});
$('#save').onclick=async()=>{
  pick(null);
  const r=R(),W=1080,s=W/r.width,H=Math.round(r.height*s)+130,c=document.createElement('canvas');
  c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const p=await ld('plate'),pr=$('#plate').getBoundingClientRect();
  x.drawImage(p,(pr.left-r.left)*s,(pr.top-r.top)*s,pr.width*s,pr.height*s);
  for(const it of [...items].sort((a,b)=>a.z-b.z)){
    const i=await ld(it.k),w=it.w*W,h=w*i.height/i.width;
    x.save();x.translate(it.x*W,it.y*r.height*s);x.rotate(it.r*Math.PI/180);x.drawImage(i,-w/2,-h/2,w,h);x.restore()}
  try{await document.fonts.load('600 44px "Noto Sans Thai"')}catch(e){}
  x.fillStyle='#1f2b24';x.textAlign='center';x.font='600 44px "Noto Sans Thai",sans-serif';
  x.fillText('โรงทานช่างศิลปบรม',W/2,H-50);
  c.toBlob(b=>{blob=b;$('#out').src=URL.createObjectURL(b);$('#modal').classList.add('on')},'image/png')};
$('#close').onclick=()=>$('#modal').classList.remove('on');
$('#dl').onclick=async()=>{
  const f=new File([blob],'rongtan-bcfa.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'โรงทานช่างศิลปบรม'});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rongtan-bcfa.png';a.click()};
bar();
</script>
